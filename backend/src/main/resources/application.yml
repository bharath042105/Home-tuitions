spring:
  application:
    name: hometuitions-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hometuitions}?prepareThreshold=0&preparedStatementCacheQueries=0
    username: ${DB_USERNAME:hometuitions}
    password: ${DB_PASSWORD:hometuitions}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is Flyway-owned, Hibernate never auto-generates DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:bharathreddypvt@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_BASE64_ENCODED_SECRET_MIN_256_BITS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  s3:
    bucket: ${S3_BUCKET:hometuitions-dev-documents}
    region: ${S3_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_CHANGE_ME}
    key-secret: ${RAZORPAY_KEY_SECRET:CHANGE_ME}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:CHANGE_ME}
  payment:
    commission-rate: ${PLATFORM_COMMISSION_RATE:0.15}
  notification:
    admin-emails: ${APP_NOTIFICATION_ADMIN_EMAILS:${ADMIN_NOTIFICATION_EMAILS:vidyatutorspoint@gmail.com,sbharathreddy219@gmail.com,bharathreddypvt@gmail.com}}
    admin-phones: ${APP_NOTIFICATION_ADMIN_PHONES:${ADMIN_NOTIFICATION_PHONES:918074470640,916303619089,918143241349}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
app:
  ratelimit:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
