services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_DB: hometuitions
      POSTGRES_USER: hometuitions
      POSTGRES_PASSWORD: hometuitions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Local S3-compatible substitute for dev/testing - the real S3StorageService generates
  # presigned URLs via the AWS SDK, which needs real credentials against real AWS.
  # MinIO speaks the same S3 API so verification-document upload can be tested end to
  # end locally without an actual AWS account (see app.s3.endpoint in application.yml).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
