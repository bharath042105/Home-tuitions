spring:
  application:
    name: hometuitions-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hometuitions}
    username: ${DB_USERNAME:hometuitions}
    password: ${DB_PASSWORD:hometuitions}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is Flyway-owned, Hibernate never auto-generates DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_BASE64_ENCODED_SECRET_MIN_256_BITS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  s3:
    bucket: ${S3_BUCKET:hometuitions-dev-documents}
    region: ${S3_REGION:ap-south-1}
    endpoint: ${S3_ENDPOINT:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_CHANGE_ME}
    key-secret: ${RAZORPAY_KEY_SECRET:CHANGE_ME}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:CHANGE_ME}
  payment:
    commission-rate: ${PLATFORM_COMMISSION_RATE:0.15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
app:
  ratelimit:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
